<section class="page" id="page-login">
  <div class="card">
    <div class="card-header">🔐 Login</div>
    <div class="card-body">
      <form id="loginForm">
        <div class="field">
          <label for="loginUsername">Usuário (@)</label>
          <input id="loginUsername" placeholder="@seuUsuario" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </div>
        <p id="loginError" style="color: var(--danger-700); font-weight: 700; display: none;"></p>
        <button class="btn" type="submit" style="width: 100%;">Entrar</button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
        Ainda não tem conta?
        <a href="#" onclick="showAuth('cadastro'); return false;" style="color: var(--sky-600); font-weight: 700; text-decoration: none;">Cadastre-se</a>
      </p>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = e.target.querySelector("button");
      var errEl = document.getElementById("loginError");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Entrando...";

      var username = document.getElementById("loginUsername").value;
      var password = document.getElementById("loginPassword").value;

      apiCall("login", username, password)
        .then(function (res) { onLoggedIn(res.user, res.token); })
        .catch(function (err) {
          errEl.textContent = friendlyError(err);
          errEl.style.display = "block";
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = "Entrar";
        });
    });
  });
</script>
